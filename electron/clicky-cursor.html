<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Clicky</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .ring {
      position: absolute; inset: 4px;
      border-radius: 50%;
      border: 2px solid rgba(255, 196, 120, 0.95);
      box-shadow: 0 0 0 3px rgba(255, 120, 80, 0.35), 0 8px 20px rgba(0,0,0,0.35);
      background:
        radial-gradient(circle at 32% 34%, #fff 0 8%, transparent 9%),
        radial-gradient(circle at 68% 34%, #fff 0 8%, transparent 9%),
        radial-gradient(ellipse 58% 30% at 50% 70%, transparent 0 40%, #1a2030 41% 55%, transparent 56%),
        linear-gradient(145deg, #ffd56e, #ff8f5a 45%, #ff5e7a);
      animation: pulse 0.9s ease-in-out infinite;
    }
    .ring.armed { border-color: rgba(109,255,176,0.95); }
    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(-4deg); }
      50% { transform: scale(1.08) rotate(6deg); }
    }
  </style>
</head>
<body><div class="ring" id="ring" title="Clicky"></div>
<script>
  window.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.type === "armed") document.getElementById("ring").classList.toggle("armed", !!d.on);
  });
</script>
</body>
</html>
