<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pointer privacy veil</title>
    <style>
      html, body {
        margin: 0; width: 100%; height: 100%;
        background: rgba(6, 8, 14, 0.72);
        -webkit-backdrop-filter: blur(18px) saturate(120%);
        backdrop-filter: blur(18px) saturate(120%);
        pointer-events: none;
      }
      .msg {
        position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%);
        font: 600 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
        color: rgba(245, 247, 251, 0.88);
        letter-spacing: 0.02em;
        text-shadow: 0 1px 8px rgba(0,0,0,0.45);
      }
    </style>
  </head>
  <body>
    <div class="msg">Pointer · filling securely · Esc to abort</div>
  </body>
</html>
