<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netie Stage</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e8eefc;
        user-select: none;
        pointer-events: none;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* Bottom status only — no orb, bubbles, matrix, or cursor chrome. */
      .subs {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        max-width: min(720px, 80vw);
        padding: 10px 16px;
        border-radius: 12px;
        background: rgba(14, 18, 28, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.22);
        font-size: 13px;
        line-height: 1.35;
        text-align: center;
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
      }
      .subs.visible { opacity: 1; }
      .subs.hidden-empty { display: none; }
      .nod-banner {
        position: absolute;
        left: 50%;
        bottom: 78px;
        transform: translateX(-50%);
        padding: 12px 18px;
        border-radius: 14px;
        background: rgba(18, 22, 34, 0.88);
        border: 1px solid rgba(109, 255, 176, 0.35);
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      .nod-banner.visible { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="nod-banner" id="nod-banner">Nod · say "yes" · or press Y</div>
      <div class="subs hidden-empty" id="subs"></div>
    </div>
    <script src="netie-sound.js"></script>
    <script src="stage.js"></script>
  </body>
</html>
