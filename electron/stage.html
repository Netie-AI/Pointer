<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Netie Stage</title>
    <style>
      :root {
        --ink: #f7f8fc;
        --soft: rgba(20, 22, 30, 0.55);
        --accent: #7eb6ff;
        --glow: rgba(126, 182, 255, 0.45);
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-app-region: no-drag;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      /* Bottom subtitle strip — Cluely-style, content-protected by the BrowserWindow */
      .subs {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        max-width: min(920px, 86vw);
        min-width: 280px;
        padding: 14px 22px;
        border-radius: 16px;
        background: var(--soft);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        text-align: center;
        font-size: 18px;
        line-height: 1.45;
        letter-spacing: 0.01em;
        opacity: 0;
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none;
      }
      .subs.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .subs.hidden-empty { opacity: 0; }

      /* Right-side chat bubbles */
      .bubbles {
        position: absolute;
        right: 18px;
        top: 12%;
        bottom: 120px;
        width: min(340px, 32vw);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 10px;
        pointer-events: none;
      }
      .bubble {
        align-self: flex-end;
        max-width: 100%;
        padding: 10px 14px;
        border-radius: 16px 16px 4px 16px;
        background: rgba(18, 22, 34, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        animation: popIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .bubble.user {
        align-self: flex-end;
        background: rgba(91, 140, 255, 0.35);
        border-radius: 16px 16px 16px 4px;
      }
      .bubble.netie {
        border-color: rgba(126, 182, 255, 0.35);
      }
      @keyframes popIn {
        from { opacity: 0; transform: translateX(18px) scale(0.92); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }

      /* Cute Netie orb — blinks / spins while thinking */
      .orb-wrap {
        position: absolute;
        right: 28px;
        bottom: 110px;
        width: 56px;
        height: 56px;
        pointer-events: none;
      }
      .orb {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 28%, #fff 0 8%, transparent 9%),
          radial-gradient(circle at 70% 28%, #fff 0 8%, transparent 9%),
          radial-gradient(circle at 50% 55%, #1a2030 0 12%, transparent 13%),
          linear-gradient(145deg, #9ec5ff, #6ea8ff 45%, #4f8fff);
        box-shadow: 0 0 0 0 var(--glow), 0 10px 28px rgba(0, 0, 0, 0.35);
        animation: idle 2.8s ease-in-out infinite;
      }
      .orb.thinking {
        animation: spinBlink 0.9s linear infinite;
      }
      .orb.talking {
        animation: talk 0.45s ease-in-out infinite;
      }
      /* Wild crazy smile — agent is doing the work for the user */
      .orb.crazy {
        animation: crazySmile 0.55s ease-in-out infinite;
        background:
          radial-gradient(circle at 28% 32%, #fff 0 7%, transparent 8%),
          radial-gradient(circle at 72% 32%, #fff 0 7%, transparent 8%),
          radial-gradient(ellipse 55% 28% at 50% 68%, transparent 0 38%, #1a2030 39% 52%, transparent 53%),
          linear-gradient(145deg, #ffd56e, #ff8f5a 40%, #ff5e7a);
        box-shadow: 0 0 22px 6px rgba(255, 120, 90, 0.45), 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      .orb.crazy::after {
        content: "";
        position: absolute;
        inset: 18% 22% 28%;
        border-radius: 50%;
        border-bottom: 3px solid rgba(26, 32, 48, 0.85);
        transform: scaleY(1.35);
        pointer-events: none;
      }
      @keyframes crazySmile {
        0%, 100% { transform: rotate(-6deg) scale(1); filter: hue-rotate(0deg); }
        35% { transform: rotate(8deg) scale(1.12); filter: hue-rotate(25deg); }
        70% { transform: rotate(-4deg) scale(1.06); filter: hue-rotate(-15deg); }
      }
      /* Matrix rain veil while agent works — soft, not dashboard clutter */
      .matrix {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        overflow: hidden;
        z-index: 2;
        mix-blend-mode: screen;
      }
      .matrix.on { opacity: 0.55; }
      .matrix span {
        position: absolute;
        top: -20%;
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 11px;
        line-height: 1.15;
        color: rgba(110, 255, 176, 0.55);
        writing-mode: vertical-rl;
        text-orientation: upright;
        animation: matrixFall linear infinite;
        white-space: nowrap;
        letter-spacing: 0.08em;
      }
      @keyframes matrixFall {
        from { transform: translateY(-10%); opacity: 0.15; }
        20% { opacity: 0.7; }
        to { transform: translateY(120vh); opacity: 0.05; }
      }
      .cursor-bubble.working {
        border-color: rgba(255, 150, 100, 0.65);
        box-shadow: 0 0 24px rgba(255, 120, 80, 0.35), 0 10px 28px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }
      .cursor-bubble.working .label {
        color: #ffd4a8;
      }
      @keyframes idle {
        0%, 100% { transform: translateY(0); box-shadow: 0 0 0 0 var(--glow); }
        50% { transform: translateY(-4px); box-shadow: 0 0 18px 4px var(--glow); }
      }
      @keyframes spinBlink {
        0% { transform: rotate(0deg) scale(1); filter: brightness(1); }
        40% { filter: brightness(1.25); }
        50% { transform: rotate(180deg) scale(1.06); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes talk {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .layout-below .bubbles {
        left: 50%;
        right: auto;
        top: auto;
        bottom: 110px;
        width: min(640px, 70vw);
        transform: translateX(-50%);
        align-items: center;
      }
      .layout-below .bubble {
        align-self: center;
        border-radius: 16px;
      }
      .layout-below .orb-wrap {
        right: 50%;
        transform: translateX(50%);
        bottom: 100px;
      }

      /* Sticky bubble that follows the system cursor (teach / act path). */
      .cursor-bubble {
        position: absolute;
        left: 0;
        top: 0;
        max-width: min(420px, 42vw);
        min-width: 160px;
        padding: 12px 16px;
        border-radius: 16px 16px 16px 4px;
        background: rgba(14, 18, 28, 0.82);
        border: 1px solid rgba(126, 182, 255, 0.4);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        opacity: 0;
        pointer-events: none;
        transform: translate(18px, 18px) scale(0.94);
        transition: opacity 0.2s ease, transform 0.18s ease, width 0.25s ease, max-width 0.25s ease;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        z-index: 5;
      }
      .cursor-bubble.visible {
        opacity: 1;
        transform: translate(18px, 18px) scale(1);
      }
      .cursor-bubble.grow {
        max-width: min(520px, 52vw);
        font-size: 14px;
        padding: 14px 18px;
      }
      .cursor-bubble .step {
        display: block;
        margin: 4px 0;
        padding-left: 2px;
      }
      .cursor-bubble .step.active {
        color: #9ec5ff;
        font-weight: 650;
      }
      .cursor-bubble .label {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(247, 248, 252, 0.55);
        margin-bottom: 6px;
      }
      .nod-banner {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        padding: 12px 18px;
        border-radius: 14px;
        background: rgba(18, 22, 34, 0.88);
        border: 1px solid rgba(109, 255, 176, 0.35);
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      .nod-banner.visible { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="matrix" id="matrix" aria-hidden="true"></div>
      <div class="bubbles" id="bubbles"></div>
      <div class="cursor-bubble" id="cursor-bubble">
        <div class="label" id="cursor-label">Netie</div>
        <div id="cursor-body"></div>
      </div>
      <div class="nod-banner" id="nod-banner">Nod · say “yes” · or press Y</div>
      <div class="orb-wrap"><div class="orb" id="orb" title="Netie"></div></div>
      <div class="subs hidden-empty" id="subs"></div>
    </div>
    <script src="netie-sound.js"></script>
    <script src="stage.js"></script>
  </body>
</html>
