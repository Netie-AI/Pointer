<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netie teach overlay</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
      }
      #walk-chrome {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: none;
        align-items: center;
        gap: 10px;
        max-width: min(720px, 86vw);
        padding: 8px 12px;
        border-radius: 999px;
        background: #111;
        border: 1px solid #345;
        color: #eee;
        font: 650 12px "Segoe UI", system-ui, sans-serif;
        pointer-events: auto;
      }
      #walk-chrome.show { display: inline-flex; }
      body.draw { pointer-events: auto; cursor: crosshair; }
      #draw-stroke, #walk-ink {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #draw-stroke { z-index: 3; }
      #walk-ink { z-index: 2; }
      #draw-stroke polyline, #walk-ink polyline {
        fill: none;
        stroke: #9ad;
        stroke-width: 0.55;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #walk-ink polyline.then, #walk-ink polyline.done {
        stroke: #567;
        stroke-width: 0.45;
      }
      #draw-ghost {
        position: absolute;
        z-index: 3;
        border: 2px dashed #9ad;
        border-radius: 8px;
        pointer-events: none;
      }
      #walk-cue { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #walk-then {
        margin: 0;
        color: #9ad;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #walk-chrome button {
        pointer-events: auto;
        background: #1a1a1a;
        color: #9ad;
        border: 1px solid #345;
        padding: 4px 10px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }
      #point-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .point-mark {
        position: absolute;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .point-mark::before, .point-mark::after {
        content: "";
        position: absolute;
        background: #6ea8ff;
        opacity: 0.85;
      }
      .point-mark::before { width: 26px; height: 1.5px; }
      .point-mark::after { width: 1.5px; height: 26px; }
      .point-ring {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 1.5px solid rgba(110, 168, 255, 0.6);
      }
      .point-label {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
        background: #111;
        border: 1px solid #345;
        color: #eee;
        font: 650 11px "Segoe UI", system-ui, sans-serif;
      }
      .point-mark.point-box {
        transform: none;
        border: 2px solid #6ea8ff;
        border-radius: 8px;
        background: rgba(110, 168, 255, 0.12);
        pointer-events: none;
      }
      .point-mark.point-box .point-label { top: -22px; }
      .point-key {
        position: absolute;
        top: -22px;
        right: 6px;
        padding: 2px 6px;
        border-radius: 6px;
        background: #1a1a1a;
        border: 1px solid #345;
        color: #9ad;
        font: 650 10px "Segoe UI", system-ui, sans-serif;
      }
      .point-mark.point-box .point-key { top: -22px; }
      .point-mark.point-box::before, .point-mark.point-box::after { display: none; }
      .point-face {
        position: absolute;
        inset: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font: 650 11px "Segoe UI", system-ui, sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .point-face.field {
        background: #e8eef4;
        border: 1px solid #9ad;
        border-radius: 4px;
        color: #111;
      }
      .point-face.button {
        background: #345;
        border: 1px solid #6be;
        border-radius: 6px;
        color: #eee;
      }
      .point-face.region {
        background: #15202c;
        border: 1px dashed #567;
        border-radius: 6px;
        color: #eee;
      }
      .point-mark.later::before, .point-mark.later::after,
      .point-mark.done::before, .point-mark.done::after { display: none; }
      .point-mark.point-box.later {
        border-style: dashed;
        border-color: rgba(110, 168, 255, 0.45);
        background: transparent;
      }
      .point-mark.point-box.done {
        border-color: rgba(238, 238, 238, 0.28);
        background: transparent;
        opacity: 0.4;
      }
      .point-mark.point-box.now {
        animation: teach-now-pulse 1.4s ease-in-out infinite;
      }
      @keyframes teach-now-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(110, 168, 255, 0.45); }
        50% { box-shadow: 0 0 0 8px rgba(110, 168, 255, 0); }
      }
      html.demo, html.demo body,
      html.host, html.host body {
        pointer-events: auto;
        background: #243044;
      }
      html.demo #point-layer .point-box:not(.later):not(.done),
      html.host #point-layer .point-box:not(.later):not(.done) {
        pointer-events: auto;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="walk-chrome" class="chrome">
      <p id="walk-cue"></p>
      <p id="walk-then" hidden></p>
      <button type="button" id="walk-back" data-q="back">Back</button>
      <button type="button" id="walk-next" data-q="got it, next">Got it</button>
      <button type="button" id="walk-draw">Draw</button>
    </div>
    <svg id="walk-ink" viewBox="0 0 100 100" preserveAspectRatio="none" hidden></svg>
    <svg id="draw-stroke" viewBox="0 0 100 100" preserveAspectRatio="none" hidden></svg>
    <div id="draw-ghost" class="point-mark point-box" hidden></div>
    <div id="point-layer" aria-hidden="true"></div>
    <script>
      const layer = document.getElementById("point-layer");
      const chromeBar = document.getElementById("walk-chrome");
      const cueEl = document.getElementById("walk-cue");
      const thenEl = document.getElementById("walk-then");
      const api = window.netieTeachOverlay;
      const hasApi = Boolean(api && typeof api.invoke === "function");
      let mouseOverChrome = false;
      const demoQuery = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);
      let demo = demoQuery;
      if (demo) document.documentElement.classList.add("demo");
      else if (!hasApi) document.documentElement.classList.add("host");
      let demoAdvance = function () {};
      let demoWalk = [];
      let demoStep = 0;

      function restLine(rest, cue) {
        const t = String(rest || "").trim();
        if (t) return "Then: " + t;
        return String(cue || "").trim() ? "Last step" : "";
      }

      function overlayControlFace(cue) {
        const t = String(cue || "").toLowerCase();
        if (/\btype in\b|\bedit\b|\bemail\b|\bfield\b|\binput\b/.test(t)) return "field";
        if (/\bclick\b|\bsave\b|\bcancel\b|\bbutton\b|\bsubmit\b/.test(t)) return "button";
        return "region";
      }

      function overlayControlCaption(cue) {
        return (
          String(cue || "control")
            .replace(/^\d+\s+of\s+\d+\s+/i, "")
            .replace(/^\d+\s+/, "")
            .replace(/^(type in|click|look at)\s+/i, "")
            .replace(/\s+then\s+tab$/i, "")
            .trim()
            .slice(0, 24) || "control"
        );
      }

      function paint(points) {
        if (!layer) return;
        while (layer.firstChild) layer.removeChild(layer.firstChild);
        (points || []).forEach(function (point) {
          const mark = document.createElement("div");
          const boxed = Number(point.wPct) > 0 && Number(point.hPct) > 0;
          const later = Boolean(point.later);
          const done = Boolean(point.done);
          mark.className = boxed ? "point-mark point-box" : "point-mark";
          if (later) mark.classList.add("later");
          if (done) mark.classList.add("done");
          if (boxed && !later && !done) mark.classList.add("now");
          if (boxed) {
            mark.style.left = Number(point.leftPct) + "%";
            mark.style.top = Number(point.topPct) + "%";
            mark.style.width = Number(point.wPct) + "%";
            mark.style.height = Number(point.hPct) + "%";
          } else {
            mark.style.left = Number(point.xPct) + "%";
            mark.style.top = Number(point.yPct) + "%";
          }
          if (!later && !done && !boxed) {
            const ring = document.createElement("div");
            ring.className = "point-ring";
            mark.appendChild(ring);
          }
          if (boxed) {
            const kind = point.face || overlayControlFace(point.label);
            const face = document.createElement("div");
            face.className = "point-face " + (kind === "field" ? "field" : kind === "button" ? "button" : "region");
            face.textContent = point.caption || overlayControlCaption(point.label);
            mark.appendChild(face);
          }
          if (point.label) {
            const label = document.createElement("span");
            label.className = "point-label";
            label.textContent = String(point.label).slice(0, 40);
            mark.appendChild(label);
          }
          if (!later && !done && point.key) {
            const kbd = document.createElement("span");
            kbd.className = "point-key";
            kbd.textContent = String(point.key).slice(0, 12);
            mark.appendChild(kbd);
          }
          if (!hasApi && boxed && !later && !done) {
            mark.addEventListener("click", function (ev) {
              ev.preventDefault();
              onAsk("i clicked");
            });
          }
          layer.appendChild(mark);
        });
        paintWalkInk(points);
      }

      function paintWalkInk(points) {
        const ink = document.getElementById("walk-ink");
        if (!ink) return;
        while (ink.firstChild) ink.removeChild(ink.firstChild);
        let n = 0;
        (points || []).forEach(function (point) {
          const pts = point && Array.isArray(point.stroke) ? point.stroke : [];
          if (pts.length < 2) return;
          const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
          line.setAttribute(
            "points",
            pts
              .map(function (p) {
                return Number(p.x) + " " + Number(p.y);
              })
              .join(" ")
          );
          if (point.later) line.classList.add("then");
          if (point.done) line.classList.add("done");
          ink.appendChild(line);
          n += 1;
        });
        ink.hidden = n === 0;
      }

      function paintChrome(event) {
        const cue = String((event && event.cue) || "").trim();
        const rest = String((event && event.rest) || "").trim();
        if (cueEl) {
          const action = String(cue || "").replace(/^\d+\s+of\s+\d+\s+/i, "").trim();
          cueEl.textContent = action;
        }
        if (thenEl) {
          const line = restLine(rest, cue);
          thenEl.hidden = !line;
          thenEl.textContent = line;
        }
        if (chromeBar) chromeBar.classList.toggle("show", Boolean(cue));
        const action = String(cue || "").replace(/^\d+\s+of\s+\d+\s+/i, "").trim();
        speakTeachCue(action);
      }

      let lastSpokenTeach = "";
      function speakTeachCue(line) {
        const text = String(line || "").trim();
        if (!text || text === lastSpokenTeach) return;
        if (document.hidden) return;
        if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
        lastSpokenTeach = text;
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        } catch (err) {
          lastSpokenTeach = "";
        }
      }

      function syncClickThrough(over) {
        if (over === mouseOverChrome) return;
        mouseOverChrome = over;
        if (api && typeof api.invoke === "function") {
          api.invoke("teach-overlay:setIgnoreMouse", { ignore: !over });
        }
      }

      const ghost = document.getElementById("draw-ghost");
      const strokeSvg = document.getElementById("draw-stroke");
      let drawing = false;
      let drag = null;

      function clearStroke() {
        if (!strokeSvg) return;
        while (strokeSvg.firstChild) strokeSvg.removeChild(strokeSvg.firstChild);
        strokeSvg.hidden = true;
      }

      function setDraw(on) {
        drawing = Boolean(on);
        document.body.classList.toggle("draw", drawing);
        if (ghost) ghost.hidden = true;
        clearStroke();
        drag = null;
        if (api && typeof api.invoke === "function") {
          api.invoke("teach-overlay:setIgnoreMouse", { ignore: !drawing && !mouseOverChrome });
        }
      }

      function pctFromEvent(ev) {
        const w = window.innerWidth || 1;
        const h = window.innerHeight || 1;
        return {
          x: Math.max(0, Math.min(100, (ev.clientX / w) * 100)),
          y: Math.max(0, Math.min(100, (ev.clientY / h) * 100)),
        };
      }

      function pushStroke(pts, p) {
        const last = pts[pts.length - 1];
        if (!last) {
          pts.push(p);
          return;
        }
        const dx = p.x - last.x;
        const dy = p.y - last.y;
        if (dx * dx + dy * dy < 0.12) return;
        if (pts.length >= 80) pts[pts.length - 1] = p;
        else pts.push(p);
      }

      function paintStroke(pts) {
        if (!strokeSvg) return;
        while (strokeSvg.firstChild) strokeSvg.removeChild(strokeSvg.firstChild);
        if (!pts || pts.length < 2) {
          strokeSvg.hidden = true;
          return;
        }
        const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        let points = "";
        for (let i = 0; i < pts.length; i++) {
          points += (i ? " " : "") + pts[i].x + "," + pts[i].y;
        }
        line.setAttribute("points", points);
        strokeSvg.appendChild(line);
        strokeSvg.hidden = false;
      }

      function paintGhost() {
        if (!drag || !ghost) return;
        const pts = drag.stroke || [];
        let x0 = drag.x0;
        let y0 = drag.y0;
        let x1 = drag.x1;
        let y1 = drag.y1;
        for (let i = 0; i < pts.length; i++) {
          x0 = Math.min(x0, pts[i].x);
          y0 = Math.min(y0, pts[i].y);
          x1 = Math.max(x1, pts[i].x);
          y1 = Math.max(y1, pts[i].y);
        }
        ghost.style.left = x0 + "%";
        ghost.style.top = y0 + "%";
        ghost.style.width = Math.abs(x1 - x0) + "%";
        ghost.style.height = Math.abs(y1 - y0) + "%";
        ghost.hidden = false;
        paintStroke(pts);
      }

      function onAdvance(ev) {
        if (ev.target && ev.target.closest && ev.target.closest("#walk-draw")) {
          ev.preventDefault();
          setDraw(true);
          return;
        }
        const btn = ev.target && ev.target.closest ? ev.target.closest("button[data-q]") : null;
        const q = btn && String(btn.getAttribute("data-q") || "").trim();
        if (!q) return;
        ev.preventDefault();
        onAsk(q);
      }

      if (chromeBar) chromeBar.addEventListener("click", onAdvance);
      document.addEventListener("pointerdown", function (ev) {
        if (!drawing || (ev.button != null && ev.button !== 0)) return;
        if (ev.target && ev.target.closest && ev.target.closest(".chrome")) return;
        const p = pctFromEvent(ev);
        drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, stroke: [p] };
        paintGhost();
        ev.preventDefault();
      });
      document.addEventListener("pointermove", function (ev) {
        const over = Boolean(ev.target && ev.target.closest && ev.target.closest(".chrome"));
        if (!drawing) syncClickThrough(over);
        if (!drawing || !drag) return;
        const p = pctFromEvent(ev);
        drag.x1 = p.x;
        drag.y1 = p.y;
        pushStroke(drag.stroke, p);
        paintGhost();
      }, true);
      function demoClipBox(left, top, w, h) {
        if (!Number.isFinite(left) || !Number.isFinite(top) || !(w > 0) || !(h > 0)) return null;
        if (left < 0 || top < 0 || left >= 100 || top >= 100) return null;
        const right = Math.min(100, left + w);
        const bottom = Math.min(100, top + h);
        const ww = right - Math.max(0, left);
        const hh = bottom - Math.max(0, top);
        if (ww < 0.4 || hh < 0.4) return null;
        return { leftPct: Math.max(0, left), topPct: Math.max(0, top), wPct: ww, hPct: hh };
      }

      function demoParseFrame(spec) {
        if (!spec || typeof spec !== "object") return null;
        const stroke = Array.isArray(spec.stroke) ? spec.stroke : [];
        if (stroke.length >= 2) {
          let x0 = Infinity;
          let y0 = Infinity;
          let x1 = -Infinity;
          let y1 = -Infinity;
          stroke.forEach(function (p) {
            const x = Number(p && p.x);
            const y = Number(p && p.y);
            if (!Number.isFinite(x) || !Number.isFinite(y)) return;
            x0 = Math.min(x0, x);
            y0 = Math.min(y0, y);
            x1 = Math.max(x1, x);
            y1 = Math.max(y1, y);
          });
          return demoClipBox(x0, y0, x1 - x0, y1 - y0);
        }
        const x0 = Number(spec.x0);
        const y0 = Number(spec.y0);
        const x1 = Number(spec.x1);
        const y1 = Number(spec.y1);
        if (!Number.isFinite(x0) || !Number.isFinite(y0) || !Number.isFinite(x1) || !Number.isFinite(y1)) return null;
        return demoClipBox(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
      }

      function paintDemoState() {
        const pts = demoWalk.map(function (p, i) {
          return Object.assign({}, p, {
            later: i > demoStep,
            done: i < demoStep,
          });
        });
        paint(pts);
        const now = demoWalk[demoStep] || {};
        const next = demoWalk[demoStep + 1] || {};
        paintChrome({
          cue: now.label || now.cue || "",
          rest: next.label || next.cue || "",
        });
      }

      function demoFrame(spec) {
        if (demoWalk.length >= 8) return false;
        const box = demoParseFrame(spec);
        if (!box) return false;
        const n = demoWalk.length + 1;
        const ink = Array.isArray(spec && spec.stroke)
          ? spec.stroke.filter(function (p) {
              return Number.isFinite(Number(p && p.x)) && Number.isFinite(Number(p && p.y));
            }).slice(0, 80).map(function (p) {
              return { x: Number(p.x), y: Number(p.y) };
            })
          : [];
        demoWalk.push({
          leftPct: box.leftPct,
          topPct: box.topPct,
          wPct: box.wPct,
          hPct: box.hPct,
          label: "Look at region " + n,
          face: "region",
          caption: "region " + n,
          stroke: ink.length >= 2 ? ink : undefined,
        });
        paintDemoState();
        return true;
      }

      function applyLive(m) {
        const path = Array.isArray(m && m.path) ? m.path : [];
        paint(path);
        paintChrome({
          cue: (m && (m.action || m.cue)) || "",
          rest: (m && m.rest) || "",
        });
      }

      function onAsk(q) {
        const text = String(q || "").trim();
        if (!text) return;
        if (hasApi) {
          api.invoke("teach-overlay:ask", { message: text, act: false });
          return;
        }
        if (demo) demoAdvance(q);
        else {
          fetch("/api/teach", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ask: text, act: false }),
          })
            .then(function (r) { return r.json(); })
            .then(function (m) {
              if (!m || m.act || m.exec) return;
              if (m.ok) applyLive(m);
            })
            .catch(function () {});
        }
      }

      function onFrame(box) {
        if (hasApi) {
          api.invoke("teach-overlay:frame", { region: box, act: false });
          return;
        }
        if (demo) {
          demoFrame(box);
          return;
        }
        fetch("/api/teach", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ region: box, act: false }),
        })
          .then(function (r) { return r.json(); })
          .then(function (m) {
            if (!m || !m.ok || m.act || m.exec) return;
            applyLive(m);
          })
          .catch(function () {});
      }

      function startDemo() {
        demo = true;
        document.documentElement.classList.add("demo");
        document.documentElement.classList.remove("host");
        demoWalk = [
          {
            leftPct: 18,
            topPct: 28,
            wPct: 48,
            hPct: 14,
            label: "Type in Email",
            face: "field",
            caption: "Email",
            stroke: [
              { x: 18, y: 28 },
              { x: 66, y: 28 },
              { x: 66, y: 42 },
              { x: 18, y: 42 },
              { x: 18, y: 28 },
            ],
          },
          { leftPct: 52, topPct: 52, wPct: 22, hPct: 12, label: "Click Save", face: "button", caption: "Save" },
        ];
        demoStep = 0;
        demoAdvance = function (q) {
          const last = demoWalk.length - 1;
          if (/\bback\b/i.test(String(q || ""))) demoStep = Math.max(0, demoStep - 1);
          else if (demoStep < last) demoStep += 1;
          paintDemoState();
        };
        paintDemoState();
      }

      function endDrag() {
        if (!drawing || !drag) return;
        const stroke = drag.stroke ? drag.stroke.slice() : [];
        const box = { x0: drag.x0, y0: drag.y0, x1: drag.x1, y1: drag.y1, stroke: stroke };
        drag = null;
        if (ghost) ghost.hidden = true;
        clearStroke();
        setDraw(false);
        if (stroke.length < 2) return;
        onFrame(box);
      }
      document.addEventListener("pointerup", endDrag);
      document.addEventListener("pointercancel", function () {
        drag = null;
        if (ghost) ghost.hidden = true;
        clearStroke();
        setDraw(false);
      });
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && drawing) setDraw(false);
      });
      document.addEventListener("pointerleave", function () {
        if (!drawing) syncClickThrough(false);
      }, true);

      if (api && typeof api.onPoint === "function") {
        api.onPoint(function (event) {
          paint(event && event.points);
          paintChrome(event);
        });
      } else if (demoQuery) {
        startDemo();
      } else {
        fetch("/api/teach")
          .then(function (r) { return r.json(); })
          .then(function (m) {
            if (m && !m.localFirst && !m.exec && Array.isArray(m.path) && m.path.length) {
              demo = false;
              applyLive(m);
              return;
            }
            startDemo();
          })
          .catch(function () {
            startDemo();
          });
      }
    </script>
  </body>
</html>
